<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking | TravelX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
GLOBAL STYLING
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;

    /* Background Image */
    background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1974&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    color:white;
}

/* =========================
NAVBAR
========================= */

nav{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8%;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:700;
    color:#38bdf8;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-size:16px;
    transition:0.3s;
    position:relative;
}

nav ul li a:hover{
    color:#38bdf8;
}

nav ul li a::after{
    content:'';
    position:absolute;
    width:0;
    height:2px;
    left:0;
    bottom:-5px;
    background:#38bdf8;
    transition:0.3s;
}

nav ul li a:hover::after{
    width:100%;
}

/* =========================
BOOKING SECTION
========================= */

.booking-page{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:60px 20px;
}

.booking-page h2{
    font-size:3rem;
    margin-bottom:10px;
    animation:fadeDown 1s ease;
}

.booking-page p{
    font-size:18px;
    margin-bottom:35px;
    color:#e2e8f0;
}

/* Booking Card */

.booking-container{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
    animation:fadeUp 1s ease;
}

/* Form */

#bookingForm{
    display:flex;
    flex-direction:column;
    gap:18px;
}

#bookingForm input,
#bookingForm select{
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:rgba(255,255,255,0.15);
    color:white;
}

#bookingForm input::placeholder{
    color:#e2e8f0;
}

/* Select Option */
#bookingForm select option{
    color:black;
}

/* Buttons */

button{
    padding:14px;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button[type="button"]{
    background:linear-gradient(135deg,#06b6d4,#2563eb);
    color:white;
}

button[type="submit"]{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 5px 15px rgba(255,255,255,0.25);
}

/* Price Display */

#totalPrice{
    margin-top:10px;
    font-size:24px;
    color:#facc15;
    min-height:30px;
}

/* =========================
FOOTER
========================= */

footer{
    text-align:center;
    padding:20px;
    background:rgba(0,0,0,0.4);
    margin-top:40px;
    color:#cbd5e1;
}

/* =========================
ANIMATIONS
========================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    .booking-page h2{
        font-size:2rem;
    }

    .booking-container{
        padding:25px;
    }
}

</style>

</head>

<body>

<!-- =========================
NAVBAR
========================= -->

<nav>

<div class="logo">TravelX</div>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="destinations.html">Destinations</a></li>
<li><a href="packages.html">Packages</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="booking.html">Booking</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<!-- =========================
BOOKING SECTION
========================= -->

<section class="booking-page">

<h2>✈️ Book Your Dream Trip</h2>

<p>Select your destination and calculate your travel cost instantly.</p>

<div class="booking-container">

<form id="bookingForm">

<input type="text" placeholder="Enter Your Name" required>

<input type="email" placeholder="Enter Your Email" required>

<select id="destination">

<option value="45000">Maldives - ₹45,000</option>
<option value="60000">Dubai - ₹60,000</option>
<option value="95000">Switzerland - ₹95,000</option>
<option value="30000">Goa - ₹30,000</option>

</select>

<input type="number" id="people" placeholder="Number of Travelers" required>

<button type="button" onclick="calculatePrice()">
Calculate Price
</button>

<h3 id="totalPrice"></h3>

<button type="submit">
Book Now
</button>

</form>

</div>

</section>

<!-- =========================
FOOTER
========================= -->

<footer>

<p>© 2026 TravelX Agency | Explore The World 🌍</p>

</footer>

<!-- =========================
JAVASCRIPT
========================= -->

<script>

/* Calculate Price */

function calculatePrice(){

    let destinationPrice =
    document.getElementById("destination").value;

    let people =
    document.getElementById("people").value;

    if(people === "" || people <= 0){

        alert("Please enter valid number of travelers");
        return;
    }

    let total = destinationPrice * people;

    document.getElementById("totalPrice").innerHTML =
    "Total Price: ₹" + total.toLocaleString();

}

/* Booking Message */

document.getElementById("bookingForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    alert("🎉 Booking Successful! Have a Safe Journey.");

});

</script>

</body>
</html>
