<!-- Booking Section -->

<section class="booking-page">

<h2>Book Your Dream Trip ✈️</h2>

<p>Select destination and calculate your trip price instantly.</p>

<div class="booking-container">

<form id="bookingForm">

<input type="text" placeholder="Enter Your Name" required>

<input type="email" placeholder="Enter Your Email" required>

<select id="destination">

<option value="45000">Maldives - ₹45,000</option>

<option value="60000">Dubai - ₹60,000</option>

<option value="95000">Switzerland - ₹95,000</option>

<option value="30000">Goa - ₹30,000</option>

</select>

<input type="number" id="people" placeholder="Number of Travelers" required>

<button type="button" onclick="calculatePrice()">

Calculate Price

</button>

<h3 id="totalPrice"></h3>

<button type="submit">Book Now</button>

</form>

</div>
