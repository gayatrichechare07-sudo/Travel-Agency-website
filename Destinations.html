<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Top Destinations</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Poppins',sans-serif;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        position:relative;
        background:#0f172a;
    }

    /* Animated background */
    body::before{
        content:"";
        position:absolute;
        inset:0;
        background:
        linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1974&auto=format&fit=crop');
        background-size:cover;
        background-position:center;
        animation:zoomBg 20s infinite alternate ease-in-out;
        z-index:-2;
    }

    @keyframes zoomBg{
        from{
            transform:scale(1);
        }
        to{
            transform:scale(1.1);
        }
    }

    /* Floating blur circles */
    .blur{
        position:absolute;
        border-radius:50%;
        filter:blur(90px);
        opacity:0.5;
        z-index:-1;
    }

    .blur1{
        width:300px;
        height:300px;
        background:#38bdf8;
        top:-80px;
        left:-80px;
    }

    .blur2{
        width:250px;
        height:250px;
        background:#9333ea;
        bottom:-60px;
        right:-60px;
    }

    /* Main Card */
    .card{
        width:90%;
        max-width:700px;
        background:rgba(255,255,255,0.12);
        backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,0.2);
        border-radius:25px;
        padding:35px;
        box-shadow:0 10px 40px rgba(0,0,0,0.35);
        color:white;
        animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{
        from{
            opacity:0;
            transform:translateY(40px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .title{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:25px;
    }

    .title h1{
        font-size:2.3rem;
        font-weight:700;
    }

    .title button{
        padding:10px 18px;
        border:none;
        border-radius:30px;
        background:linear-gradient(135deg,#06b6d4,#3b82f6);
        color:white;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    .title button:hover{
        transform:translateY(-3px);
        box-shadow:0 5px 15px rgba(59,130,246,0.5);
    }

    table{
        width:100%;
        border-collapse:collapse;
        overflow:hidden;
    }

    th{
        text-align:left;
        padding:15px;
        font-size:0.9rem;
        text-transform:uppercase;
        color:#dbeafe;
        border-bottom:1px solid rgba(255,255,255,0.2);
    }

    td{
        padding:16px 15px;
        font-size:1rem;
        border-bottom:1px solid rgba(255,255,255,0.1);
        transition:0.3s;
    }

    tbody tr{
        transition:0.3s;
    }

    tbody tr:hover{
        background:rgba(255,255,255,0.12);
        transform:scale(1.02);
    }

    .country{
        display:flex;
        align-items:center;
        gap:12px;
        font-weight:500;
    }

    .flag{
        font-size:1.4rem;
    }

    .rating{
        color:#facc15;
        font-weight:600;
    }

    /* Progress bar */
    .bar{
        width:100%;
        height:8px;
        background:rgba(255,255,255,0.15);
        border-radius:20px;
        overflow:hidden;
        margin-top:6px;
    }

    .fill{
        height:100%;
        border-radius:20px;
        background:linear-gradient(90deg,#facc15,#f97316);
    }

    /* Mobile Responsive */
    @media(max-width:768px){

        .card{
            padding:25px;
        }

        .title{
            flex-direction:column;
            gap:15px;
            align-items:flex-start;
        }

        .title h1{
            font-size:1.8rem;
        }

        td,th{
            padding:12px 10px;
        }
    }
</style>
</head>

<body>

<div class="blur blur1"></div>
<div class="blur blur2"></div>

<div class="card">

    <div class="title">
        <h1>🌍 Top Destinations</h1>
        <button onclick="showMessage()">Explore</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Destination</th>
                <th>Rating</th>
            </tr>
        </thead>

        <tbody id="tableBody">

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇲🇻</span> Maldives
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.9</div>
                    <div class="bar">
                        <div class="fill" style="width:98%"></div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇨🇭</span> Switzerland
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.8</div>
                    <div class="bar">
                        <div class="fill" style="width:96%"></div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇦🇪</span> Dubai
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.7</div>
                    <div class="bar">
                        <div class="fill" style="width:94%"></div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇮🇩</span> Bali
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.8</div>
                    <div class="bar">
                        <div class="fill" style="width:96%"></div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇫🇷</span> Paris
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.9</div>
                    <div class="bar">
                        <div class="fill" style="width:98%"></div>
                    </div>
                </td>
            </tr>

            <tr>
                <td>
                    <div class="country">
                        <span class="flag">🇮🇳</span> Goa
                    </div>
                </td>
                <td>
                    <div class="rating">⭐ 4.6</div>
                    <div class="bar">
                        <div class="fill" style="width:92%"></div>
                    </div>
                </td>
            </tr>

        </tbody>
    </table>

</div>

<script>

    // Button interaction
    function showMessage(){
        alert("✈️ Start your dream journey today!");
    }

    // Smooth row animation on page load
    const rows = document.querySelectorAll("tbody tr");

    rows.forEach((row,index)=>{
        row.style.opacity = "0";
        row.style.transform = "translateY(20px)";

        setTimeout(()=>{
            row.style.transition = "0.6s ease";
            row.style.opacity = "1";
            row.style.transform = "translateY(0)";
        }, index * 150);
    });

</script>

</body>
</html>
